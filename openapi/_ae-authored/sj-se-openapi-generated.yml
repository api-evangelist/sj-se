components:
  schemas:
    GetBookingResponse:
      type: object
      properties:
        booking:
          type: object
          description: Complete booking information with tickets
    PostBookingRequest:
      type: object
      properties:
        externalRef:
          type: string
          description: Client‑side booking reference
        purchaser:
          type: object
          description: Purchaser details
        offers:
          type: array
          description: Selected offer IDs and passenger references
        passengerSpecifications:
          type: array
          description: Passenger data for the booking
        embed:
          type: array
          description: Embedding options, e.g., "ALL"
      required:
      - externalRef
      - purchaser
      - offers
      - passengerSpecifications
    PostOffersRequest:
      type: object
      properties:
        tripSpecifications:
          type: array
          description: List of trips to get offers for
        offerSearchCriteria:
          type: object
          description: Search criteria such as currency
        anonymousPassengerSpecifications:
          type: array
          description: Passenger data needed for pricing
        embed:
          type: array
          description: Embedding options, e.g., "ALL"
      required:
      - tripSpecifications
      - offerSearchCriteria
      - anonymousPassengerSpecifications
    PostOffersResponse:
      type: object
      properties:
        offers:
          type: array
          description: List of offer objects
    GetBookingResponse2:
      type: object
      properties:
        booking.id:
          type: string
          description: Booking identifier.
        booking.fulfillmentId:
          type: string
          description: Identifier of the fulfillment (if present).
    PostBookingRequest2:
      type: object
      properties:
        bookingrequest.externalRef:
          type: string
          description: Unique booking reference in the caller’s system.
        passenger:
          type: string
          description: Passenger information (firstName, lastName, optional email/phone).
        placeSelection:
          type: string
          description: Place selection for seat/compartment.
      required:
      - bookingrequest.externalRef
      - passenger
    PostBookingResponse:
      type: object
      properties:
        booking.id:
          type: string
          description: Booking identifier.
        booking.bookingCode:
          type: string
          description: Same value as booking.id.
    GetBookingsBookingidResponse:
      type: object
      properties:
        booking.id:
          type: string
          description: Booking identifier.
        booking.fulfillmentId:
          type: string
          description: Identifier of the fulfillment.
    PostContactsContactidRequest:
      type: object
      properties:
        email:
          type: string
          description: Must be URL encoded
      required:
      - email
    PostContactsContactidResponse:
      type: object
      properties:
        '200':
          type: string
          description: A Customer object (see schema definitions)
        '404':
          type: string
          description: There is no SJ customer with this email address.
    PostExchangeOffersRequest:
      type: object
      properties:
        exchangeOffer:
          type: string
          description: Details of the exchange request, including fulfillments to exchange.
      required:
      - exchangeOffer
    PostExchangeOperationsRequest:
      type: object
      properties:
        exchangeOperation:
          type: string
          description: Details of the exchange operation.
      required:
      - exchangeOperation
    GetFulfillmentsFulfillmentidResponse:
      type: object
      properties:
        fulfillment.controlNumber:
          type: string
          description: Ticket number.
        fulfillment.aztecCode:
          type: string
          description: Base64 string of the Aztec code.
    PostOffersRequest2:
      type: object
      properties:
        tripSpecifications:
          type: array
          description: List of trips to get offers for
        offerSearchCriteria:
          type: object
          description: Search criteria such as currency
        anonymousPassengerSpecifications:
          type: array
          description: Passenger data needed for pricing
        embed:
          type: array
          description: Embedding options, e.g., "ALL"
      required:
      - tripSpecifications
      - offerSearchCriteria
      - anonymousPassengerSpecifications
    PostOffersResponse2:
      type: object
      properties:
        offers:
          type: array
          description: List of offer objects
    PatchPassengerRequest:
      type: object
      properties:
        passenger.id:
          type: string
          description: Identifier of the passenger to patch.
        passenger:
          type: string
          description: Complete passenger details (firstName, lastName, optional age, cards).
      required:
      - passenger.id
      - passenger
tags:
- name: Availabilities
- name: Booking
- name: Bookings
- name: Contacts
- name: Exchange Offers
- name: Exchange Operations
- name: Fulfillments
- name: Offers
- name: Passenger
- name: Tenant Id
